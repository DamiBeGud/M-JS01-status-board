apiVersion: apps/v1
kind: Deployment
metadata:
  name: ba-status-board-first-merge
  namespace: deployflow-test
  labels: &id001
    app.kubernetes.io/name: ba-status-board-first-merge
    app.kubernetes.io/managed-by: deployflow
    app.kubernetes.io/instance: 5c5edd05-2d54-4ba7-a659-22d7bd54ee4c
spec:
  replicas: 1
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
      annotations:
        deployflow.io/config-sha256: be33c019fce29f54a504c2d0687cb54a2342644e82c77ced176275ff9f7abfa9
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ba-status-board-first-merge
        image: ghcr.io/damibegud/m-js01-status-board:b0cc59dc4a8203d9a2ef993b811ebdf1bef49edb
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3201
          name: http
        envFrom:
        - configMapRef:
            name: ba-status-board-first-merge-config
        env: []
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet:
            path: /live
            port: http
        livenessProbe:
          httpGet:
            path: /live
            port: http
