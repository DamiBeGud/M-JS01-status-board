apiVersion: apps/v1
kind: Deployment
metadata:
  name: ba-status-board-public
  namespace: deployflow-test
  labels: &id001
    app.kubernetes.io/name: ba-status-board-public
    app.kubernetes.io/managed-by: deployflow
    app.kubernetes.io/instance: 5e4105ba-0114-4288-9c9d-c912610fc075
spec:
  replicas: 1
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
      annotations:
        deployflow.io/config-sha256: be33c019fce29f54a504c2d0687cb54a2342644e82c77ced176275ff9f7abfa9
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ba-status-board-public
        image: ghcr.io/damibegud/m-js01-status-board:7476fad3fab90ff978599678a589e51fa41365b1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3201
          name: http
        envFrom:
        - configMapRef:
            name: ba-status-board-public-config
        env: []
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet:
            path: /live
            port: http
        livenessProbe:
          httpGet:
            path: /live
            port: http
